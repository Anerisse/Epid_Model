<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1700" viewBox="0 0 2000 1700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0.5,0.5 L9.5,5 L0.5,9.5" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0.5,0.5 L9.5,5 L0.5,9.5" fill="none" stroke="#6D28D9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .uc      { fill:#EAF2FB; stroke:#2F5D8A; stroke-width:1.6; }
      .uc-plan { fill:#FDF4E3; stroke:#B45309; stroke-width:1.6; stroke-dasharray:7 4; }
      .uctext  { font-size:14px; fill:#0F172A; text-anchor:middle; }
      .ucsub   { font-size:13px; fill:#0F172A; text-anchor:middle; }
      .edge    { fill:none; stroke:#475569; stroke-width:1.4; stroke-dasharray:7 4; marker-end:url(#arr); }
      .refine  { fill:none; stroke:#6D28D9; stroke-width:1.3; stroke-dasharray:3 3; marker-end:url(#arrV); }
      .assoc   { fill:none; stroke:#1F2937; stroke-width:1.8; }
      .elabel  { font-size:12px; font-style:italic; fill:#475569; text-anchor:middle;
                 paint-order:stroke fill; stroke:#ffffff; stroke-width:4px; stroke-linejoin:round; }
      .rlabel  { font-size:9.5px; font-style:italic; fill:#6D28D9; text-anchor:middle;
                 paint-order:stroke fill; stroke:#ffffff; stroke-width:3.5px; stroke-linejoin:round; }
      .guard   { font-size:11px; font-style:italic; fill:#64748B; text-anchor:middle;
                 paint-order:stroke fill; stroke:#ffffff; stroke-width:4px; stroke-linejoin:round; }
      .req     { fill:#F1F5F9; stroke:#475569; stroke-width:1.2; }
      .reqkw   { font-size:9px; font-style:italic; fill:#64748B; }
      .reqtx   { font-size:10px; fill:#0F172A; }
    </style>
  </defs>

  <rect width="2000" height="1700" fill="#ffffff"/>

  <!-- Заголовок -->
  <text x="280" y="36" font-size="20" font-weight="bold" fill="#0F172A">Диаграмма вариантов использования (SysML) — ИС «Моделирование эпидемий»</text>

  <!-- Граница системы (охватывает только варианты использования) -->
  <rect x="280" y="60" width="1160" height="1420" fill="#FBFCFD" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="296" y="90" font-size="16" font-weight="bold" fill="#0F172A">ИС «Моделирование эпидемий»</text>

  <!-- Сноска: обязательность первого шага -->
  <rect x="620" y="130" width="390" height="120" fill="#FFF8E7" stroke="#B45309" stroke-width="1.3"/>
  <text x="636" y="154" font-size="11.5" font-weight="bold" fill="#7C4A03">Первый обязательный шаг:</text>
  <text x="636" y="175" font-size="11" fill="#7C4A03">без заданной и разобранной системы</text>
  <text x="636" y="193" font-size="11" fill="#7C4A03">ОДУ (SR1) этапы симуляции,</text>
  <text x="636" y="211" font-size="11" fill="#7C4A03">параметризации и верификации</text>
  <text x="636" y="229" font-size="11" fill="#7C4A03">невыполнимы.</text>
  <line x1="700" y1="250" x2="622" y2="352" stroke="#B45309" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Актор -->
  <g stroke="#0F172A" stroke-width="2" fill="none">
    <circle cx="140" cy="640" r="18" fill="#ffffff"/>
    <line x1="140" y1="658" x2="140" y2="730"/>
    <line x1="105" y1="680" x2="175" y2="680"/>
    <line x1="140" y1="730" x2="105" y2="775"/>
    <line x1="140" y1="730" x2="175" y2="775"/>
  </g>
  <text x="140" y="798" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">«actor»</text>
  <text x="140" y="818" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Исследователь</text>

  <!-- Ассоциации актора с целями -->
  <line class="assoc" x1="175" y1="690" x2="410" y2="400"/>
  <line class="assoc" x1="175" y1="690" x2="410" y2="540"/>
  <line class="assoc" x1="175" y1="690" x2="410" y2="700"/>
  <line class="assoc" x1="175" y1="690" x2="410" y2="845"/>
  <line class="assoc" x1="175" y1="690" x2="410" y2="1000"/>

  <!-- Связи include -->
  <line class="edge" x1="750" y1="390" x2="1010" y2="335"/>
  <line class="edge" x1="750" y1="530" x2="1010" y2="475"/>
  <line class="edge" x1="750" y1="690" x2="1010" y2="635"/>
  <line class="edge" x1="750" y1="712" x2="1010" y2="780"/>
  <line class="edge" x1="750" y1="1012" x2="1010" y2="1225"/>

  <!-- Связи extend -->
  <line class="edge" x1="1010" y1="930" x2="770" y2="730"/>
  <line class="edge" x1="1010" y1="1080" x2="780" y2="745"/>
  <line class="edge" x1="1010" y1="1380" x2="770" y2="1030"/>

  <!-- Связи refine к требованиям -->
  <line class="refine" x1="750" y1="400" x2="1570" y2="400"/>
  <line class="refine" x1="750" y1="540" x2="1570" y2="540"/>
  <line class="refine" x1="750" y1="700" x2="1570" y2="700"/>
  <line class="refine" x1="750" y1="845" x2="1570" y2="845"/>
  <line class="refine" x1="750" y1="1000" x2="1570" y2="1000"/>
  <line class="refine" x1="1350" y1="330" x2="1570" y2="330"/>
  <line class="refine" x1="1350" y1="470" x2="1570" y2="470"/>
  <line class="refine" x1="1350" y1="630" x2="1570" y2="630"/>
  <line class="refine" x1="1350" y1="930" x2="1570" y2="930"/>
  <path class="refine" d="M 750,400 H 1420 V 260 H 1570"/>
  <path class="refine" d="M 750,540 H 1400 V 770 H 1570"/>
  <path class="refine" d="M 1350,780 H 1450 V 708 H 1570"/>
  <path class="refine" d="M 1350,1080 H 1490 V 724 H 1570"/>
  <path class="refine" d="M 1350,1230 H 1440 V 1008 H 1570"/>
  <path class="refine" d="M 1350,1380 H 1480 V 1024 H 1570"/>

  <!-- Подписи связей -->
  <text class="elabel" x="880" y="353">«include»</text>
  <text class="elabel" x="880" y="493">«include»</text>
  <text class="elabel" x="880" y="653">«include»</text>
  <text class="elabel" x="884" y="738">«include»</text>
  <text class="elabel" x="872" y="1110">«include»</text>
  <text class="elabel" x="884" y="822">«extend»</text>
  <text class="guard" x="884" y="854">[если нет наблюдений]</text>
  <text class="elabel" x="900" y="920">«extend»</text>
  <text class="guard" x="900" y="950">[план]</text>
  <text class="elabel" x="890" y="1197">«extend»</text>
  <text class="guard" x="890" y="1227">[план]</text>
  <text class="rlabel" x="1500" y="392">«refine»</text>
  <text class="rlabel" x="1500" y="252">«refine»</text>
  <text class="rlabel" x="1500" y="322">«refine»</text>
  <text class="rlabel" x="1500" y="532">«refine»</text>
  <text class="rlabel" x="1500" y="462">«refine»</text>
  <text class="rlabel" x="1470" y="762">«refine»</text>
  <text class="rlabel" x="1500" y="622">«refine»</text>
  <text class="rlabel" x="1460" y="692">«refine»</text>
  <text class="rlabel" x="1535" y="700">«refine»</text>
  <text class="rlabel" x="1535" y="732">«refine»</text>
  <text class="rlabel" x="1500" y="837">«refine»</text>
  <text class="rlabel" x="1500" y="922">«refine»</text>
  <text class="rlabel" x="1440" y="992">«refine»</text>
  <text class="rlabel" x="1530" y="1000">«refine»</text>
  <text class="rlabel" x="1530" y="1032">«refine»</text>

  <!-- Цели актора -->
  <ellipse class="uc" cx="580" cy="400" rx="170" ry="48"/>
  <text class="uctext" x="580" y="396">Задать систему ОДУ</text>
  <text class="uctext" x="580" y="416">(текстом, в браузере)</text>

  <ellipse class="uc" cx="580" cy="540" rx="170" ry="48"/>
  <text class="uctext" x="580" y="536">Смоделировать динамику</text>
  <text class="uctext" x="580" y="556">эпидемии (РК4)</text>

  <ellipse class="uc" cx="580" cy="700" rx="170" ry="48"/>
  <text class="uctext" x="580" y="696">Параметризовать модель</text>
  <text class="uctext" x="580" y="716">по данным</text>

  <ellipse class="uc" cx="580" cy="845" rx="170" ry="48"/>
  <text class="uctext" x="580" y="841">Сохранить/загрузить</text>
  <text class="uctext" x="580" y="861">модель и расчёты</text>

  <ellipse class="uc-plan" cx="580" cy="1000" rx="170" ry="48"/>
  <text class="uctext" x="580" y="996">Верифицировать модель</text>
  <text class="uctext" x="580" y="1016">(в разработке)</text>

  <!-- Включаемые и расширяемые варианты -->
  <ellipse class="uc" cx="1180" cy="330" rx="170" ry="40"/>
  <text class="ucsub" x="1180" y="335">Построить блок-схему модели</text>

  <ellipse class="uc" cx="1180" cy="470" rx="170" ry="40"/>
  <text class="ucsub" x="1180" y="466">Рассчитать число R₀</text>
  <text class="ucsub" x="1180" y="486">(метод NGM)</text>

  <ellipse class="uc" cx="1180" cy="630" rx="170" ry="40"/>
  <text class="ucsub" x="1180" y="626">Ввести наблюдения I(t)</text>
  <text class="ucsub" x="1180" y="646">(текст или файл)</text>

  <ellipse class="uc" cx="1180" cy="780" rx="170" ry="40"/>
  <text class="ucsub" x="1180" y="776">Оценить параметры</text>
  <text class="ucsub" x="1180" y="796">(МНК · Нелдер–Мид)</text>

  <ellipse class="uc" cx="1180" cy="930" rx="170" ry="40"/>
  <text class="ucsub" x="1180" y="926">Сгенерировать синтетические</text>
  <text class="ucsub" x="1180" y="946">данные</text>

  <ellipse class="uc-plan" cx="1180" cy="1080" rx="170" ry="40"/>
  <text class="ucsub" x="1180" y="1076">Альтернативные методы</text>
  <text class="ucsub" x="1180" y="1096">MCMC, нейросеть (план)</text>

  <ellipse class="uc-plan" cx="1180" cy="1230" rx="170" ry="40"/>
  <text class="ucsub" x="1180" y="1226">Рассчитать метрики согласия</text>
  <text class="ucsub" x="1180" y="1246">(RMSE, R², остатки, план)</text>

  <ellipse class="uc-plan" cx="1180" cy="1380" rx="170" ry="40"/>
  <text class="ucsub" x="1180" y="1376">Проверить на контрольной</text>
  <text class="ucsub" x="1180" y="1396">выборке (план)</text>

  <!-- Требования (вне границы системы) -->
  <rect class="req" x="1570" y="228" width="300" height="64"/>
  <text class="reqkw" x="1582" y="248">«requirement» SR9</text>
  <text class="reqtx" x="1582" y="268">Работа в браузере без кода</text>

  <rect class="req" x="1570" y="298" width="300" height="64"/>
  <text class="reqkw" x="1582" y="318">«requirement» SR3</text>
  <text class="reqtx" x="1582" y="338">Автоматическая блок-схема</text>

  <rect class="req" x="1570" y="368" width="300" height="64"/>
  <text class="reqkw" x="1582" y="388">«requirement» SR1</text>
  <text class="reqtx" x="1582" y="408">Ввод системы ОДУ текстом</text>

  <rect class="req" x="1570" y="438" width="300" height="64"/>
  <text class="reqkw" x="1582" y="458">«requirement» SR6</text>
  <text class="reqtx" x="1582" y="478">Расчёт R₀ методом NGM</text>

  <rect class="req" x="1570" y="508" width="300" height="64"/>
  <text class="reqkw" x="1582" y="528">«requirement» SR4</text>
  <text class="reqtx" x="1582" y="548">Численная симуляция (РК4)</text>

  <rect class="req" x="1570" y="598" width="300" height="64"/>
  <text class="reqkw" x="1582" y="618">«requirement» SR2</text>
  <text class="reqtx" x="1582" y="638">Загрузка временных рядов</text>

  <rect class="req" x="1570" y="668" width="300" height="64"/>
  <text class="reqkw" x="1582" y="688">«requirement» SR5</text>
  <text class="reqtx" x="1582" y="708">Оценка параметров (МНК + Нелдер–Мид)</text>

  <rect class="req" x="1570" y="738" width="300" height="64"/>
  <text class="reqkw" x="1582" y="758">«requirement» SR8</text>
  <text class="reqtx" x="1582" y="778">Визуализация результатов</text>

  <rect class="req" x="1570" y="813" width="300" height="64"/>
  <text class="reqkw" x="1582" y="833">«requirement» SR10</text>
  <text class="reqtx" x="1582" y="853">Воспроизводимость расчётов</text>

  <rect class="req" x="1570" y="898" width="300" height="64"/>
  <text class="reqkw" x="1582" y="918">«requirement» SR11</text>
  <text class="reqtx" x="1582" y="938">Идентифицируемость, синтетический</text>
  <text class="reqtx" x="1582" y="952">контроль</text>

  <rect class="req" x="1570" y="968" width="300" height="64"/>
  <text class="reqkw" x="1582" y="988">«requirement» SR7</text>
  <text class="reqtx" x="1582" y="1008">Верификация: RMSE, R², остатки,</text>
  <text class="reqtx" x="1582" y="1022">сохранение популяции</text>

  <!-- Условные обозначения -->
  <rect x="280" y="1500" width="1160" height="116" fill="#ffffff" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="298" y="1524" font-size="14" font-weight="bold" fill="#0F172A">Условные обозначения</text>
  <ellipse class="uc" cx="380" cy="1560" rx="82" ry="22"/>
  <text x="380" y="1565" font-size="11.5" fill="#0F172A" text-anchor="middle">Реализовано</text>
  <ellipse class="uc-plan" cx="570" cy="1560" rx="82" ry="22"/>
  <text x="570" y="1565" font-size="11.5" fill="#0F172A" text-anchor="middle">Планируется</text>
  <rect class="req" x="700" y="1538" width="140" height="44"/>
  <text x="770" y="1565" font-size="11.5" fill="#0F172A" text-anchor="middle">Требование (SR)</text>
  <line class="assoc" x1="300" y1="1598" x2="420" y2="1598"/>
  <text class="elabel" x="360" y="1588" font-size="11">ассоциация</text>
  <line class="edge" x1="480" y1="1598" x2="600" y2="1598"/>
  <text class="elabel" x="540" y="1588">«include»</text>
  <line class="edge" x1="680" y1="1598" x2="800" y2="1598"/>
  <text class="elabel" x="740" y="1588">«extend»</text>
  <line class="refine" x1="880" y1="1598" x2="1000" y2="1598"/>
  <text class="rlabel" x="940" y="1588">«refine»</text>
  <text x="280" y="1650" font-size="11" fill="#475569">Трассировка: BR1–BR2 уточняются требованиями SR1–SR11; каждый вариант использования связан с требованием отношением «refine»;</text>
  <text x="280" y="1668" font-size="11" fill="#475569">SR уточняются системными требованиями SysReq1–SysReq11; тест-кейсы TC1–TC11 верифицируют SysReq.</text>
</svg>
