<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simula — моделирование эпидемий</title>
    <script>
      // Применяем сохранённую тему до первой отрисовки (без «мигания»)
      try {
        var saved = localStorage.getItem("simula-theme");
        var light = saved === "light" || (!saved && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.classList.toggle("light", light);
        document.documentElement.style.colorScheme = light ? "light" : "dark";
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
